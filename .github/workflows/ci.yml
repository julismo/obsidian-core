name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Scan current and reachable history
        shell: bash
        run: |
          npm run scan:public-safety
          while IFS= read -r revision; do
            npm run scan:public-safety -- "$revision"
          done < <(git rev-list --all)

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify starter structure
        run: npm run verify
